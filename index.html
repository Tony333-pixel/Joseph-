<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Improve Ourselves</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2433;--mu:#6b7488;--pr:#5b5bf0;--pr2:#e8e8ff;--ok:#16a34a;--bad:#e5484d;--bd:#e3e7f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c;--card:#1a1f2d;--tx:#eef1f8;--mu:#97a1b8;--pr:#8383ff;--pr2:#2a2d52;--bd:#2b3246}}
:root[data-theme="dark"]{--bg:#10131c;--card:#1a1f2d;--tx:#eef1f8;--mu:#97a1b8;--pr:#8383ff;--pr2:#2a2d52;--bd:#2b3246}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.brand{font-weight:800;font-size:1.3rem}.brand span{color:var(--pr)}
nav{display:flex;gap:6px;overflow-x:auto;margin:8px 0 16px;padding-bottom:4px}
nav button{white-space:nowrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.g .card{margin:0}.big{font-size:1.9rem;font-weight:800;color:var(--pr)}.mu{color:var(--mu);font-size:.9rem}
h2{margin:0 0 10px;font-size:1.3rem}h3{margin:0 0 8px;font-size:1.05rem}
button,.btn{font:inherit;border:0;border-radius:999px;padding:10px 18px;background:var(--pr2);color:var(--pr);font-weight:600;cursor:pointer}
button.p{background:var(--pr);color:#fff}button.on{background:var(--pr);color:#fff}button:disabled{opacity:.45;cursor:default}
input,textarea{font:inherit;width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:4px 0 10px}
.bar{height:10px;background:var(--pr2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);border-radius:99px;transition:width .3s}
.opt{display:block;width:100%;text-align:left;margin:8px 0;border-radius:14px;background:var(--bg);color:var(--tx);border:2px solid var(--bd)}
.opt.sel{border-color:var(--pr);background:var(--pr2)}.opt.ok{border-color:var(--ok)}.opt.no{border-color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}.row:last-child{border:0}
.auth{max-width:420px;margin:6vh auto}.err{color:var(--bad);min-height:1.4em}.okm{color:var(--ok)}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0}.chk input{width:22px;height:22px;margin:0}
.av{width:96px;height:96px;border-radius:50%;background:var(--pr2);object-fit:cover;display:grid;place-items:center;font-size:2.4rem;color:var(--pr);font-weight:800;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--pr2);color:var(--pr);padding:6px 12px;border-radius:99px;font-size:.9rem}
.tabs{display:flex;gap:6px;margin-bottom:10px}svg{width:100%;height:auto}
</style></head><body><div class="w" id="app"></div>
<script>
const mem={};
const L=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):(mem[k]??null)}catch(e){return mem[k]??null}};
const S=(k,v)=>{mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=t=>t?new Date(t).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}):'—';
const fday=t=>new Date(t).toLocaleDateString([],{dateStyle:'medium'});
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function H(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,256))}
const pad=n=>String(n).padStart(2,'0'),ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function monday(d=new Date()){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
const wkKey=()=>ds(monday()),wkIdx=()=>Math.round((monday()-new Date(2024,0,1))/(7*864e5));
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,r){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// [category, question, correct, wrong, wrong, wrong]
const BANK=[
['General','Capital city of Australia?','Canberra','Sydney','Melbourne','Perth'],
['General','Largest ocean on Earth?','Pacific','Atlantic','Indian','Arctic'],
['General','How many continents are there?','7','5','6','8'],
['General','Who painted the Mona Lisa?','Leonardo da Vinci','Picasso','Van Gogh','Michelangelo'],
['General','World War II ended in which year?','1945','1939','1950','1918'],
['General','Longest river in the world (commonly cited)?','Nile','Amazon','Yangtze','Danube'],
['Computer','What does CPU stand for?','Central Processing Unit','Computer Personal Unit','Central Program Utility','Core Power Unit'],
['Computer','Binary number 101 equals what in decimal?','5','3','6','10'],
['Computer','HTML is used to…','Structure web pages','Style web pages','Store databases','Compile programs'],
['Computer','Which is NOT a programming language?','HTTP','Python','Ruby','Java'],
['Computer','How many bits are in one byte?','8','4','16','10'],
['Computer','RAM is best described as…','Temporary working memory','Permanent storage','A graphics card','A network cable'],
['Science','Chemical formula of water?','H2O','CO2','O2','NaCl'],
['Science','Which planet is closest to the Sun?','Mercury','Venus','Earth','Mars'],
['Science','Which gas do plants absorb for photosynthesis?','Carbon dioxide','Oxygen','Nitrogen','Helium'],
['Science','Which organelle is the “powerhouse” of the cell?','Mitochondria','Nucleus','Ribosome','Vacuole'],
['Science','What force pulls objects toward Earth?','Gravity','Magnetism','Friction','Inertia'],
['Science','Approximate speed of light?','300,000 km/s','30,000 km/s','3,000 km/s','3 million km/s'],
['Math','12 × 12 = ?','144','124','132','156'],
['Math','Square root of 81?','9','8','7','81'],
['Math','What is 25% of 200?','50','25','75','40'],
['Math','Angles in a triangle add up to…','180°','90°','360°','270°'],
['Math','2 to the power of 5 = ?','32','10','16','25'],
['Math','Which of these is a prime number?','7','9','15','21'],
['English','Plural of “child”?','Children','Childs','Childes','Childrens'],
['English','Synonym of “happy”?','Joyful','Gloomy','Angry','Tired'],
['English','Choose the correct sentence.','She goes to school.','She go to school.','She going to school.','She goed to school.'],
['English','Opposite of “ancient”?','Modern','Old','Historic','Dusty'],
['English','Which word is a verb?','Run','Quickly','Blue','Happy'],
['English','In “The cat sleeps”, the noun is…','cat','sleeps','The','none'],
['Life','Which habit helps you focus while studying?','Silencing notifications and taking short breaks','Studying with the TV on','Skipping meals','Studying all night'],
['Life','First aid for a bleeding cut?','Apply firm, steady pressure','Ignore it','Remove the cloth soaked in blood and rub','Apply heat'],
['Life','The 20-20-20 rule for eyes means…','Every 20 min, look 20 ft away for 20 sec','Sleep 20 hours','Blink 20 times an hour','Walk 20 km'],
['Life','A strong password is…','Long, unique, and mixed characters','Your birthday','“123456”','Your name'],
['Life','A good way to save money is to…','Set aside a part of income regularly','Spend first, save leftovers','Never track spending','Borrow often'],
['Life','How much sleep do most teenagers need?','8–10 hours','4–5 hours','6 hours','12+ hours']];
const MSG=['Small steps count. Today, choose one thing you are proud to do besides gaming.','Balance is a skill. You are practicing it right now.','Games are fun, and so is growing. You can enjoy both.','Progress, not perfection. One better day is a win.','Your time is yours to spend. Spend some on future you.','Every break you take on purpose builds your willpower.','Consistency beats intensity. Keep showing up.'];
const TIPS=['Decide your play time before you start, and set a timer.','Finish homework or study first; games become a reward.','Take a 5-minute stretch break every hour.','Keep devices out of the bedroom at night.','Plan a fun offline activity so there is something to look forward to.','Turn off notifications from games during study time.'];
const ACT=['📚 Study','🏃 Exercise','🎨 Hobbies','📖 Reading','👨‍👩‍👧 Family time','🧑‍🤝‍🧑 Meet friends','🚶 Walk outside','🎵 Music'];
const GOAL=['Study or do homework for 30 minutes','Move my body for 20 minutes','Read 10 pages','Spend time with family or friends','Keep gaming within my planned time'];

let U=null,V='home',T=null,mode='login',note='';
const users=()=>L('io_users')||[];
const K=n=>'io_'+n+'_'+U.id;
const res=()=>(L(K('r'))||[]).sort((a,b)=>a.date-b.date);
const hist=()=>L(K('h'))||[];
function stats(){const r=res(),goals=L(K('g'))||{};const gp=Object.values(goals).reduce((s,a)=>s+a.filter(Boolean).length*2,0);
 const pts=r.reduce((s,x)=>s+x.pts,0)+gp,sc=r.map(x=>x.score),keys=new Set(r.map(x=>x.week));
 let d=monday();if(!keys.has(ds(d)))d.setDate(d.getDate()-7);let streak=0;while(keys.has(ds(d))){streak++;d.setDate(d.getDate()-7)}
 const cur=r.find(x=>x.week===wkKey());
 return{r,pts,best:sc.length?Math.max(...sc):0,avg:sc.length?(sc.reduce((a,b)=>a+b,0)/sc.length):0,n:r.length,streak,cur,imp:r.length>1?r[r.length-1].score-r[r.length-2].score:0}}
function startSession(u){U=u;const at=Date.now();S('io_sess',{uid:u.id,at});const h=hist();h.push({in:at,out:null});S(K('h'),h);V='home'}
function logout(){const h=hist();if(h.length&&!h[h.length-1].out)h[h.length-1].out=Date.now();S(K('h'),h);S('io_sess',null);U=null;T=null;mode='login';note='';render()}
async function auth(kind){const g=i=>(document.getElementById(i)||{}).value||'',er=m=>{document.getElementById('err').textContent=m};
 const email=g('em').trim().toLowerCase(),pw=g('pw'),name=g('nm').trim(),us=users();
 try{
 if(kind==='signup'){if(name.length<2)return er('Please enter your name.');if(!/^\S+@\S+\.\S+$/.test(email))return er('Enter a valid email.');if(pw.length<8)return er('Password needs at least 8 characters.');if(us.find(u=>u.email===email))return er('An account with this email already exists.');
  const salt=crypto.getRandomValues(new Uint8Array(16)),u={id:crypto.randomUUID(),name,email,salt:b64(salt),hash:await H(pw,salt),created:Date.now(),avatar:'',provider:'email'};us.push(u);S('io_users',us);startSession(u)}
 else if(kind==='login'){const u=us.find(x=>x.email===email);if(!u||!u.hash||await H(pw,ub64(u.salt))!==u.hash)return er('Incorrect email or password.');startSession(u)}
 else if(kind==='google'){if(!/^[^\s@]+@gmail\.com$/.test(email))return er('Enter your Gmail address.');let u=us.find(x=>x.email===email);if(!u){u={id:crypto.randomUUID(),name:name||email.split('@')[0],email,salt:'',hash:'',created:Date.now(),avatar:'',provider:'google'};us.push(u);S('io_users',us)}startSession(u)}
 else if(kind==='reset'){const u=us.find(x=>x.email===email);if(!u)return er('No account found with that email.');if(pw.length<8)return er('New password needs at least 8 characters.');const salt=crypto.getRandomValues(new Uint8Array(16));u.salt=b64(salt);u.hash=await H(pw,salt);S('io_users',us);mode='login';note='Password updated. Please log in.'}
 }catch(x){return er('Something went wrong: '+x.message)}
 render()}
function authView(){const f=(id,l,t='text',ph='')=>`<label class="mu">${l}</label><input id="${id}" type="${t}" placeholder="${ph}" autocomplete="${t==='password'?'current-password':'on'}">`;
 const m=mode,title={login:'Welcome back',signup:'Create your account',forgot:'Reset password',google:'Continue with Google'}[m];
 return`<div class="auth"><div class="brand" style="text-align:center;font-size:2rem">Improve <span>Ourselves</span></div><p class="mu" style="text-align:center">Learn more. Play balanced. Grow every week.</p>
 <div class="card"><h2>${title}</h2><div class="okm">${e(note)}</div>
 ${m==='signup'?f('nm','Name'):''}${m==='google'?f('nm','Name (optional)'):''}${f('em','Email','email','you@example.com')}
 ${m!=='google'?f('pw',m==='forgot'?'New password':'Password','password','At least 8 characters'):''}
 <div class="err" id="err"></div>
 <button class="p" style="width:100%" onclick="auth('${m==='forgot'?'reset':m}')">${{login:'Log in',signup:'Sign up',forgot:'Reset password',google:'Continue'}[m]}</button>
 ${m==='login'||m==='signup'?`<button style="width:100%;margin-top:8px" onclick="setMode('google')">G&nbsp; Continue with Google</button>`:''}
 <p class="mu" style="text-align:center;margin:14px 0 0">${m==='login'?`<a href="#" onclick="setMode('forgot');return false">Forgot password?</a> · <a href="#" onclick="setMode('signup');return false">Create account</a>`:`<a href="#" onclick="setMode('login');return false">Back to log in</a>`}</p></div>
 <p class="mu" style="text-align:center;font-size:.8rem">Passwords are hashed (PBKDF2). Data is saved on this device in your browser.</p></div>`}
function setMode(m){mode=m;note='';render()}
const go=v=>{V=v;if(v!=='test')T=null;render();scrollTo(0,0)};
const bar=p=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;
function chart(r){if(!r.length)return'<p class="mu">Complete your first weekly test to see your chart.</p>';r=r.slice(-12);const W=320,Hh=140,bw=Math.min(36,(W-20)/r.length-6);
 return`<svg viewBox="0 0 ${W} ${Hh+26}">${r.map((x,i)=>{const h=x.score/x.total*Hh,xx=10+i*((W-20)/r.length)+3;return`<rect x="${xx}" y="${Hh-h}" width="${bw}" height="${h}" rx="6" fill="var(--pr)"/><text x="${xx+bw/2}" y="${Hh-h-4}" font-size="10" text-anchor="middle" fill="var(--tx)">${x.score}/${x.total}</text><text x="${xx+bw/2}" y="${Hh+16}" font-size="10" text-anchor="middle" fill="var(--mu)">W${i+1+(res().length-r.length)}</text>`}).join('')}</svg>`}
function home(){const s=stats(),h=hist(),cur=h[h.length-1],prev=h.slice(0,-1).filter(x=>x.out).pop();
 return`<div class="card"><h2>Hi, ${e(U.name.split(' ')[0])} 👋</h2><div class="mu">${e(MSG[new Date().getDay()])}</div></div>
 <div class="g"><div class="card"><div class="mu">This week</div><div class="big">${s.cur?s.cur.score+'/'+s.cur.total:'—'}</div><div class="mu">${s.cur?'Completed ✓':'Not taken yet'}</div></div>
 <div class="card"><div class="mu">Total points</div><div class="big">${s.pts}</div></div>
 <div class="card"><div class="mu">Tests completed</div><div class="big">${s.n}</div></div>
 <div class="card"><div class="mu">Week streak</div><div class="big">${s.streak} 🔥</div><div class="mu">${s.imp>0?'+'+s.imp+' vs last test':s.imp<0?s.imp+' vs last test':'Keep going'}</div></div></div>
 <div class="card"><h3>Weekly test</h3>${s.cur?`<p>You finished this week's test. Next one opens Monday, ${fday(new Date(monday().getTime()+7*864e5))}.</p><button onclick="go('test')">View result</button>`:`<p>This week's test is ready: 10 questions, one at a time.</p><button class="p" onclick="go('test')">Start this week's test</button>`}</div>
 <div class="card"><h3>Sessions</h3><div class="row"><span>Latest login</span><b>${fd(cur&&cur.in)}</b></div><div class="row"><span>Latest logout</span><b>${fd(prev&&prev.out)}</b></div>
 <h3 style="margin-top:14px">Previous logins / logouts</h3>${h.slice(-6).reverse().map(x=>`<div class="row"><span>In: ${fd(x.in)}</span><span class="mu">Out: ${x.out?fd(x.out):'active session'}</span></div>`).join('')}</div>
 <div class="card"><h3>Weekly test history</h3>${s.r.length?[...s.r].reverse().map((x,i)=>`<div class="row"><span>Week of ${fday(x.date)}</span><b>${x.score}/${x.total}</b></div>`).join(''):'<p class="mu">No tests yet.</p>'}</div>`}
function testView(){const s=stats();
 if(T&&T.done)return resultView(T.result,true);
 if(T){const q=T.q[T.i],n=T.q.length;return`<div class="card"><div class="mu">Question ${T.i+1} of ${n} · ${q.c}</div>${bar(T.i/n*100)}<h2 style="margin-top:16px">${e(q.t)}</h2>
 ${q.o.map((o,i)=>`<button class="opt ${T.s[T.i]===i?'sel':''}" onclick="pick(${i})">${e(o)}</button>`).join('')}
 <div style="display:flex;justify-content:space-between;margin-top:10px"><button ${T.i?'':'disabled'} onclick="T.i--;render()">Back</button><button class="p" ${T.s[T.i]==null?'disabled':''} onclick="next()">${T.i===n-1?'Finish test':'Next'}</button></div></div>`}
 if(s.cur)return resultView(s.cur,false);
 return`<div class="card"><h2>Weekly Knowledge Test</h2><p>10 multiple-choice questions on general knowledge, computers, science, maths, English and real-life skills.</p><p class="mu">You can complete one official test per week. Earn 10 points per correct answer, plus 20 bonus for a perfect score.</p><button class="p" onclick="startTest()">Begin</button></div>`}
function startTest(){const r=rng(wkIdx()*7919+13),qs=shuf(BANK,r).slice(0,10).map(b=>{const o=shuf(b.slice(2),r);return{c:b[0],t:b[1],o,a:o.indexOf(b[2])}});T={q:qs,i:0,s:[]};render()}
function pick(i){T.s[T.i]=i;render()}
function next(){if(T.i<T.q.length-1){T.i++;return render()}
 const sc=T.q.filter((q,i)=>T.s[i]===q.a).length,t=T.q.length;
 const rec={week:wkKey(),date:Date.now(),score:sc,total:t,pts:sc*10+(sc===t?20:0),qs:T.q.map((q,i)=>({t:q.t,o:q.o,a:q.a,s:T.s[i]}))};
 const r=L(K('r'))||[];if(!r.find(x=>x.week===rec.week)){r.push(rec);S(K('r'),r)}
 T={done:true,result:rec};render()}
function resultView(r,fresh){const p=r.score/r.total;
 return`<div class="card" style="text-align:center">${fresh?'<div style="font-size:2.4rem">🎉</div>':''}<div class="mu">${fresh?'Test submitted!':'Completed '+fday(r.date)}</div><div class="big" style="font-size:3rem">${r.score}/${r.total}</div><p>${p===1?'Perfect score! Amazing work.':p>=.7?'Great job! Keep it up.':'Good effort. Every test makes you stronger.'} +${r.pts} points</p>${bar(p*100)}<p class="mu">Next test opens Monday, ${fday(new Date(monday().getTime()+7*864e5))}.</p><button class="p" onclick="go('home')">Back to Home</button></div>
 <div class="card"><h3>Review</h3>${r.qs.map((q,i)=>`<div style="margin-bottom:12px"><b>${i+1}. ${e(q.t)}</b><div class="${q.s===q.a?'okm':''}" style="color:${q.s===q.a?'var(--ok)':'var(--bad)'}">Your answer: ${e(q.o[q.s])} ${q.s===q.a?'✓':'✗'}</div>${q.s!==q.a?`<div class="mu">Correct: ${e(q.o[q.a])}</div>`:''}</div>`).join('')}</div>`}
function progress(){const s=stats();
 return`<div class="g"><div class="card"><div class="mu">This week</div><div class="big">${s.cur?s.cur.score+'/'+s.cur.total:'—'}</div></div><div class="card"><div class="mu">Highest</div><div class="big">${s.best}</div></div><div class="card"><div class="mu">Average</div><div class="big">${s.avg.toFixed(1)}</div></div><div class="card"><div class="mu">Tests done</div><div class="big">${s.n}</div></div>
 <div class="card"><div class="mu">Weekly improvement</div><div class="big">${s.imp>0?'+':''}${s.imp}</div></div></div>
 <div class="card"><h3>Progress chart</h3>${chart(s.r)}</div>
 <div class="card"><h3>All weeks</h3>${s.r.length?s.r.map((x,i)=>`<div class="row"><span>Week ${i+1} <span class="mu">(${fday(x.date)})</span></span><b>${x.score}/${x.total}</b></div>${bar(x.score/x.total*100)}`).join(''):'<p class="mu">Nothing here yet — take your first test!</p>'}</div>`}
function gaming(){const t=ds(new Date()),gl=L(K('g'))||{},cl=gl[t]||[],done=cl.filter(Boolean).length,rf=(L(K('f'))||[]);
 const pm=done===5?'🌟 All goals done today. That is real progress. Be proud!':done>=3?'💪 Great momentum — almost there!':done>=1?'👏 Nice start. Every goal counts.':'Pick one small goal to begin. No pressure.';
 const wk=rf.filter(x=>Date.now()-x.date<7*864e5),av=wk.length?(wk.reduce((a,b)=>a+b.h,0)/wk.length):null;
 return`<div class="card" style="background:var(--pr2)"><h3>Today's message</h3><div>${e(MSG[new Date().getDay()])}</div></div>
 <div class="card"><h3>Daily goals · ${done}/5</h3>${bar(done*20)}${GOAL.map((g,i)=>`<label class="chk"><input type="checkbox" ${cl[i]?'checked':''} onchange="tick(${i},this.checked)">${e(g)}</label>`).join('')}<p><b>${pm}</b></p></div>
 <div class="card"><h3>Tips for managing gaming time</h3>${TIPS.map(x=>`<div class="row">• ${e(x)}</div>`).join('')}</div>
 <div class="card"><h3>Healthy things to try</h3><div class="chips">${ACT.map(a=>`<span class="chip">${a}</span>`).join('')}</div></div>
 <div class="card"><h3>Gaming-time reflection</h3><p class="mu">Log honestly — this is just for you. Awareness is the first step.</p>
 <label class="mu">Hours played today</label><input id="gh" type="number" min="0" max="24" step="0.25" placeholder="e.g. 1.5"><label class="mu">How did it feel? (optional)</label><textarea id="gn" rows="2"></textarea><button class="p" onclick="logGame()">Save reflection</button>
 ${av!==null?`<p class="mu">Your average this week: ${av.toFixed(1)} h/day. ${rf.length>1&&rf[rf.length-1].h<rf[rf.length-2].h?'Down from your last entry — nice balance! 🎉':'Gradual change works best; small steps add up.'}</p>`:''}
 ${[...rf].reverse().slice(0,6).map(x=>`<div class="row"><span>${fday(x.date)} · ${x.h} h</span><span class="mu">${e(x.n)}</span></div>`).join('')}</div>`}
function tick(i,v){const t=ds(new Date()),g=L(K('g'))||{};g[t]=g[t]||[false,false,false,false,false];g[t][i]=v;S(K('g'),g);render()}
function logGame(){const h=parseFloat(document.getElementById('gh').value);if(isNaN(h)||h<0||h>24)return alert('Enter hours between 0 and 24.');const f=L(K('f'))||[];f.push({date:Date.now(),h,n:document.getElementById('gn').value.slice(0,200)});S(K('f'),f);render()}
function profile(){const s=stats();
 return`<div class="card" style="text-align:center">${U.avatar?`<img class="av" style="margin:0 auto" src="${U.avatar}" alt="">`:`<div class="av" style="margin:0 auto">${e(U.name[0].toUpperCase())}</div>`}
 <h2 style="margin-top:10px">${e(U.name)}</h2><div class="mu">${e(U.email)}</div><p><label class="btn">Change photo<input type="file" accept="image/*" hidden onchange="photo(this.files[0])"></label></p></div>
 <div class="card"><div class="row"><span>Total points</span><b>${s.pts}</b></div><div class="row"><span>Tests completed</span><b>${s.n}</b></div><div class="row"><span>Weekly progress</span><b>${s.r.slice(-4).map(x=>x.score+'/'+x.total).join(' → ')||'—'}</b></div><div class="row"><span>Account created</span><b>${fday(U.created)}</b></div><div class="row"><span>Sign-in method</span><b>${U.provider==='google'?'Google':'Email'}</b></div></div>
 <button class="p" style="width:100%" onclick="logout()">Log out</button>`}
function photo(f){if(!f)return;const img=new Image;img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,160,160);const us=users(),u=us.find(a=>a.id===U.id);u.avatar=c.toDataURL('image/jpeg',.8);U.avatar=u.avatar;S('io_users',us);render()};img.src=URL.createObjectURL(f)}
function theme(){const t=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches)?'light':'dark';document.documentElement.setAttribute('data-theme',t);S('io_theme',t)}
function render(){
 const hd=`<header><div class="brand">Improve <span>Ourselves</span></div><button onclick="theme()" title="Light/dark">🌓</button></header>`;
 if(!U){app.innerHTML=hd+authView();return}
 const tabs=[['home','🏠 Home'],['test','📝 Weekly Test'],['progress','📈 Progress'],['gaming','🎮 Control Gaming'],['profile','👤 Profile']];
 const views={home,test:testView,progress,gaming,profile};
 app.innerHTML=hd+`<nav>${tabs.map(t=>`<button class="${V===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav>`+views[V]()}
(function(){const t=L('io_theme');if(t)document.documentElement.setAttribute('data-theme',t);
 const s=L('io_sess');if(s){const u=users().find(x=>x.id===s.uid);if(u)U=u}render()})();
</script></body></html>
